name: edutrack_mobile
description: "EduTrack Mobile Application - Smart Campus Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & HTTP
  dio: ^5.4.1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # State Management & Persistence
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0

  # Modern UI & Charts
  google_fonts: ^6.2.0
  lucide_icons: ^0.257.0
  fl_chart: ^0.66.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Hardware integrations
  geolocator: ^11.0.0
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
